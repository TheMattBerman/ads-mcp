<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Square version matching actual logo style -->
  <rect width="400" height="400" fill="#0b0c0e"/>

  <!-- Border frame -->
  <rect x="50" y="50" width="300" height="300" fill="none" stroke="#00FF80" stroke-width="6"/>

  <!-- Main text: "> STEAL" -->
  <text x="70" y="180" font-family="Arial, Helvetica, sans-serif" font-size="64" fill="#FFFFFF" font-weight="bold">&gt; STEAL</text>

  <!-- Second line: "_ADS" -->
  <text x="120" y="250" font-family="Arial, Helvetica, sans-serif" font-size="64" fill="#FFFFFF" font-weight="bold">_ADS</text>

  <!-- Green accent square -->
  <rect x="250" y="195" width="35" height="55" fill="#00FF80"/>

  <!-- .AI suffix -->
  <text x="295" y="250" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#FFFFFF" font-weight="bold">.AI</text>
</svg>
